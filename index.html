<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>우리반 번호 뽑기</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap">
<style>
/* Layout: big result stage on top, controls row, then the 1–N attendance board showing what's been drawn */
:root {
  --bg: #fff6cc;
  --surface: #ffffff;
  --ink: #1d2a44;
  --muted: #6b6550;
  --line: #e8dca8;
  --accent: #2f5bea;
  --accent-ink: #ffffff;
  --ball: #ffc93c;
  --ball-ink: #3a2a00;
  --drawn: #f3ecd0;
  --drawn-ink: #a89f80;
  --font-display: "Jua", "Gowun Dodum", system-ui, sans-serif;
  --font-body: "Gowun Dodum", system-ui, -apple-system, "Malgun Gothic", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #121826; --surface: #1b2335; --ink: #e8ecf5; --muted: #98a3bb; --line: #2c364d;
    --accent: #6f8fff; --accent-ink: #0d1424; --ball: #ffcf52; --ball-ink: #2e2200;
    --drawn: #232c40; --drawn-ink: #5b6680; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #121826; --surface: #1b2335; --ink: #e8ecf5; --muted: #98a3bb; --line: #2c364d;
  --accent: #6f8fff; --accent-ink: #0d1424; --ball: #ffcf52; --ball-ink: #2e2200;
  --drawn: #232c40; --drawn-ink: #5b6680; color-scheme: dark;
}

body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 16px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 28px 40px;
}
.wrap { max-width: 860px; margin: 0 auto; display: grid; gap: 22px; }

header { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
h1 { font-family: var(--font-display); font-weight: 400; font-size: 2rem; margin: 0; text-wrap: balance; }
.status { color: var(--muted); font-size: .95rem; font-variant-numeric: tabular-nums; }
.status b { color: var(--ink); }

.stage {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 20px;
  min-height: 210px;
  display: flex; flex-wrap: wrap; align-items: center; justify-content: center;
  gap: 16px; padding: 28px 16px;
}
.ball {
  width: 132px; height: 132px; border-radius: 50%;
  background: var(--ball); color: var(--ball-ink);
  display: grid; place-items: center;
  font-family: var(--font-display); font-size: 4rem; line-height: 1;
  font-variant-numeric: tabular-nums;
  box-shadow: inset -8px -10px 0 rgba(0,0,0,.08);
}
.stage.many .ball { width: 92px; height: 92px; font-size: 2.6rem; }
.ball.pop { animation: pop .35s ease-out; }
@keyframes pop { from { transform: scale(.6); } 70% { transform: scale(1.08); } to { transform: scale(1); } }
.hint { color: var(--muted); font-size: 1.05rem; text-align: center; }

.controls { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 14px; }
.field { display: grid; gap: 6px; }
.field label { font-size: .8rem; color: var(--muted); letter-spacing: .04em; }
.field input {
  width: 84px; padding: 10px 12px; font: inherit; font-size: 1.1rem;
  font-variant-numeric: tabular-nums;
  border: 1px solid var(--line); border-radius: 10px;
  background: var(--surface); color: var(--ink);
}
.range { display: flex; align-items: center; gap: 8px; }
.range span { color: var(--muted); padding-bottom: 2px; }
.spacer { flex: 1; }
button {
  font: inherit; font-size: 1.05rem; cursor: pointer;
  border-radius: 12px; padding: 12px 20px; border: 1px solid var(--line);
  background: var(--surface); color: var(--ink);
}
button.primary {
  background: var(--accent); color: var(--accent-ink); border-color: var(--accent);
  font-family: var(--font-display); font-size: 1.3rem; padding: 12px 30px;
}
button:disabled { opacity: .45; cursor: not-allowed; }
button:focus-visible, input:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.msg { min-height: 1.3em; color: var(--muted); font-size: .9rem; margin-top: -8px; }

.board-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; }
h2 { font-family: var(--font-display); font-weight: 400; font-size: 1.25rem; margin: 0; }
.legend { font-size: .85rem; color: var(--muted); }
.board {
  display: grid; grid-template-columns: repeat(10, minmax(0, 1fr)); gap: 8px; margin-top: 10px;
}
.cell {
  aspect-ratio: 1; max-width: 100%;
  display: grid; place-items: center;
  border: 1px solid var(--line); border-radius: 10px;
  background: var(--surface); color: var(--ink);
  font-size: 1.1rem; font-variant-numeric: tabular-nums;
  transition: background .2s, color .2s;
}
.cell.drawn { background: var(--drawn); color: var(--drawn-ink); text-decoration: line-through; }
.cell.latest { background: var(--ball); color: var(--ball-ink); border-color: var(--ball); text-decoration: none; }
.cell.flash { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }

.history { font-size: .95rem; color: var(--muted); line-height: 1.7; }
.history ol { margin: 6px 0 0; padding-left: 1.4em; color: var(--ink); font-variant-numeric: tabular-nums; }

@media (max-width: 520px) {
  .board { grid-template-columns: repeat(6, minmax(0, 1fr)); }
  .ball { width: 104px; height: 104px; font-size: 3.2rem; }
  .spacer { display: none; }
  button.primary { width: 100%; }
}
@media (prefers-reduced-motion: reduce) {
  .ball.pop { animation: none; }
  .cell { transition: none; }
}
[hidden] { display: none !important; }
*, *::before, *::after { box-sizing: border-box; }
</style>
</head>
<body>

<div class="wrap">
  <header>
    <h1>우리반 번호 뽑기</h1>
    <div class="status" id="status"></div>
  </header>

  <section class="stage" id="stage" aria-live="polite">
    <p class="hint">‘뽑기’를 누르면 번호가 나와요</p>
  </section>

  <div class="controls">
    <div class="field">
      <label for="min">번호 범위</label>
      <div class="range">
        <input id="min" type="number" inputmode="numeric" value="1" min="1">
        <span>~</span>
        <input id="max" type="number" inputmode="numeric" value="30" min="1" aria-label="마지막 번호">
      </div>
    </div>
    <div class="field">
      <label for="count">한 번에 뽑을 개수</label>
      <input id="count" type="number" inputmode="numeric" value="1" min="1">
    </div>
    <div class="spacer"></div>
    <button id="reset" type="button">처음부터</button>
    <button id="draw" type="button" class="primary">뽑기</button>
  </div>
  <div class="msg" id="msg"></div>

  <section>
    <div class="board-head">
      <h2>번호판</h2>
      <span class="legend">줄 그어진 번호는 이미 뽑혔어요 · 노란색은 방금 뽑은 번호</span>
    </div>
    <div class="board" id="board"></div>
  </section>

  <section class="history" id="history" hidden>
    <h2>뽑은 순서</h2>
    <ol id="historyList"></ol>
  </section>
</div>

<script>
const $ = id => document.getElementById(id);
const minEl = $("min"), maxEl = $("max"), countEl = $("count");
const KEY = "number-picker-state";

let state = { min: 1, max: 30, drawn: [], rounds: [] };
try {
  const saved = JSON.parse(localStorage.getItem(KEY));
  if (saved && Array.isArray(saved.drawn)) state = saved;
} catch (e) {}
minEl.value = state.min; maxEl.value = state.max;

function save() {
  try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {}
}

function remaining() {
  const left = [];
  for (let n = state.min; n <= state.max; n++) if (!state.drawn.includes(n)) left.push(n);
  return left;
}

function randInt(n) {
  const buf = new Uint32Array(1);
  crypto.getRandomValues(buf);
  return buf[0] % n;
}

function renderBoard(latest = []) {
  const board = $("board");
  board.innerHTML = "";
  for (let n = state.min; n <= state.max; n++) {
    const c = document.createElement("div");
    c.className = "cell";
    c.id = "cell-" + n;
    c.textContent = n;
    if (latest.includes(n)) c.classList.add("latest");
    else if (state.drawn.includes(n)) c.classList.add("drawn");
    board.appendChild(c);
  }
  const total = state.max - state.min + 1;
  $("status").innerHTML = `남은 번호 <b>${total - state.drawn.length}</b> / ${total}`;
  $("draw").disabled = total - state.drawn.length === 0;

  const list = $("historyList");
  list.innerHTML = "";
  state.rounds.forEach(r => {
    const li = document.createElement("li");
    li.textContent = r.join(", ") + "번";
    list.appendChild(li);
  });
  $("history").hidden = state.rounds.length === 0;
}

function showBalls(nums) {
  const stage = $("stage");
  stage.innerHTML = "";
  stage.classList.toggle("many", nums.length > 3);
  nums.forEach(n => {
    const b = document.createElement("div");
    b.className = "ball pop";
    b.textContent = n;
    stage.appendChild(b);
  });
}

function applyRange() {
  const min = parseInt(minEl.value, 10), max = parseInt(maxEl.value, 10);
  if (!Number.isFinite(min) || !Number.isFinite(max) || min < 1 || max < min) {
    $("msg").textContent = "범위를 확인해 주세요. 시작 번호는 1 이상이고 마지막 번호보다 작아야 해요.";
    return false;
  }
  if (max - min + 1 > 200) {
    $("msg").textContent = "번호는 최대 200개까지 쓸 수 있어요.";
    return false;
  }
  if (min !== state.min || max !== state.max) {
    state = { min, max, drawn: [], rounds: [] };
    save();
    $("stage").innerHTML = '<p class="hint">범위를 바꿔서 처음부터 시작해요</p>';
    renderBoard();
  }
  $("msg").textContent = "";
  return true;
}

let busy = false;
function draw() {
  if (busy || !applyRange()) return;
  const left = remaining();
  let count = parseInt(countEl.value, 10);
  if (!Number.isFinite(count) || count < 1) count = 1;
  if (count > left.length) {
    $("msg").textContent = `남은 번호가 ${left.length}개라서 ${left.length}개만 뽑았어요.`;
    count = left.length;
  }
  const pool = left.slice(), picked = [];
  for (let i = 0; i < count; i++) picked.push(pool.splice(randInt(pool.length), 1)[0]);
  picked.sort((a, b) => a - b);

  const finish = () => {
    state.drawn.push(...picked);
    state.rounds.push(picked);
    save();
    renderBoard(picked);
    showBalls(picked);
    busy = false;
    $("draw").disabled = remaining().length === 0;
  };

  if (matchMedia("(prefers-reduced-motion: reduce)").matches) return finish();

  // Short shuffle across the remaining cells before revealing
  busy = true;
  $("draw").disabled = true;
  let ticks = 0;
  const timer = setInterval(() => {
    document.querySelectorAll(".cell.flash").forEach(c => c.classList.remove("flash"));
    const n = left[randInt(left.length)];
    $("cell-" + n)?.classList.add("flash");
    if (++ticks > 14) { clearInterval(timer); finish(); }
  }, 70);
}

$("draw").addEventListener("click", draw);
$("reset").addEventListener("click", () => {
  if (busy) return;
  state.drawn = []; state.rounds = [];
  save();
  $("stage").innerHTML = '<p class="hint">모든 번호가 다시 들어갔어요</p>';
  $("msg").textContent = "";
  renderBoard();
});
[minEl, maxEl].forEach(el => el.addEventListener("change", applyRange));
document.addEventListener("keydown", e => {
  if ((e.key === " " || e.key === "Enter") && e.target === document.body) { e.preventDefault(); draw(); }
});

renderBoard(state.rounds.at(-1) || []);
if (state.rounds.length) showBalls(state.rounds.at(-1));
</script>
</body>
</html>
